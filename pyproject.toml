[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "survey-dashboard"
version = "0.1.0"
description = "Generate an interactive HTML analytics dashboard from survey CSV exports"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
survey-dashboard = "survey_dashboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
survey_dashboard = ["*.html"]
